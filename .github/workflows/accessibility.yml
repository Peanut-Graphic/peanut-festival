name: Accessibility Testing

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend-a11y:
    name: Frontend Accessibility Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.2'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Node and npm runtime contract
        run: test "$(npm --version)" = "10.9.7" && npm run runtime:verify

      - name: Install dependencies
        run: npm ci

      - name: ESLint jsx-a11y plugin
        run: npm run lint -- --ext ts,tsx

      - name: Run accessibility tests (axe-core)
        run: npm run test:a11y
        continue-on-error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accessibility-test-results
          path: |
            frontend/coverage/
            frontend/test-results/
          retention-days: 30
