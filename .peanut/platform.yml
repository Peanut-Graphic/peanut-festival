schema_version: 1
project:
  id: peanut-festival
  name: Peanut Festival
  classification: distributed-plugin
  repository: https://github.com/Peanut-Graphic/peanut-festival.git
  lifecycle: maintenance
ownership:
  platform: Peanut Graphic
  deployment: Peanut Graphic
  rollback: Peanut Graphic
environments:
  - name: distribution
    kind: production
    provider: GitHub Releases
    url: "https://github.com/Peanut-Graphic/peanut-festival/releases"
  - name: central-first-party-install
    kind: production
    provider: peanutgraphic.com shared WordPress hosting
    url: "https://peanutgraphic.com"
runtimes:
  - name: php
    baseline: WordPress compatibility matrix
    declarations:
      - { scope: dependency, source: peanut-festival.php, value: "Requires PHP 8.0" }
      - { scope: dependency, source: composer.json and composer.lock, value: "runtime require >=8.0; locked development resolver platform 8.1.0 for PHPUnit dependencies" }
      - { scope: ci, source: .github/workflows/ci.yml, value: "required exact PHP 8.0 parser/declarations and exact PHP 8.1 full suite" }
      - { scope: ci, source: .github/workflows/tests.yml and wp-contract.yml, value: "PHP 8.2 and 8.3 property plus PHP 8.3 real WordPress/MySQL" }
    production_observation: { status: verified, value: "PHP 8.5.9 on the central first-party installation; distributed client hosts unverified", observed_at: "2026-08-15T01:09:00-04:00", evidence: "read-only host interpreter and active-plugin inventory" }
  - name: node
    baseline: "22"
    declarations:
      - { scope: dependency, source: frontend/package.json and package-lock.json, value: "exact Node 22.22.2 and npm 10.9.7; packageManager npm@10.9.7; Vite 8.2.1 with compatible @vitejs/plugin-react 6.0.5; version 1.3.2" }
      - { scope: ci, source: .github/workflows/ci.yml and accessibility.yml, value: "exact Node 22.22.2 and npm 10.9.7 with source-owned declaration/runtime guard in all four frontend jobs" }
    production_observation: { status: not-applicable }
  - name: wordpress
    baseline: WordPress 6.0+
    declarations:
      - { scope: dependency, source: peanut-festival.php, value: "Requires at least 6.0" }
      - { scope: test, source: .github/workflows/wp-contract.yml, value: "WordPress latest" }
    production_observation: { status: verified, value: "WordPress 6.9.7 on the central first-party installation; distributed client hosts unverified", observed_at: "2026-08-15T01:09:00-04:00", evidence: "read-only WP-CLI core-version and active-plugin inventory" }
databases:
  - name: host-database
    role: transactional
    baseline: Host MySQL 5.7+ or MariaDB 10.3+
    declarations:
      - { scope: documentation, source: docs/DEPLOYMENT.md, value: "MySQL 5.7+ or MariaDB 10.3+" }
      - { scope: dependency, source: includes/class-activator.php and includes/class-migrations.php, value: "many dbDelta tables plus sequential versioned ALTER TABLE migrations during normal plugin boot" }
      - { scope: ci, source: .github/workflows/wp-contract.yml, value: "mysql:8 compatibility and mariadb:10.6 production-family real WordPress contract lanes; the declared MySQL 5.7 and MariaDB 10.3 minimums are not exercised" }
    production_equivalent_test: "yes"
    production_observation: { status: verified, value: "MariaDB 10.6.27, latin1_swedish_ci server collation, SQL mode ERROR_FOR_DIVISION_BY_ZERO,NO_AUTO_CREATE_USER,NO_ENGINE_SUBSTITUTION on the central first-party installation; distributed client hosts unverified", observed_at: "2026-08-15T01:09:00-04:00", evidence: "read-only database metadata query; no application rows read" }
  - name: firebase-realtime-database
    role: adjunct
    baseline: Optional per-install Firebase Realtime Database
    declarations:
      - { scope: dependency, source: includes/class-firebase.php, value: "service-account authenticated database and Cloud Messaging calls; writes fail closed without service credentials" }
      - { scope: documentation, source: docs/DEPLOYMENT.md and firebase/database.rules.json, value: "manual project, rules, service-account, and VAPID configuration" }
    production_equivalent_test: unknown
    production_observation: { status: unverified }
services:
  - kind: scheduler
    baseline: WordPress cron on each plugin installation
    declarations:
      - { scope: dependency, source: includes/class-competitions.php, value: "five-minute match deadline checks" }
      - { scope: dependency, source: includes/class-ml-festival-predictor.php, value: "weekly local ML-service training" }
      - { scope: dependency, source: includes/class-deactivator.php, value: "daily cleanup and Eventbrite schedule cleanup hooks" }
    production_observation: { status: verified, value: "Five-minute match-deadline hook registered centrally; minute job queue, weekly ML training, daily cleanup, and Eventbrite cleanup hooks absent", observed_at: "2026-08-15T01:34:00-04:00", evidence: "read-only WP-Cron schedule metadata; no event executed" }
  - kind: realtime
    baseline: Optional Firebase Realtime Database and Cloud Messaging
    declarations:
      - { scope: dependency, source: includes/class-firebase.php and includes/class-realtime-sync.php, value: "OAuth service-account writes, deletes, push notifications, and queued festival state synchronization" }
    production_observation: { status: unverified }
  - kind: other
    baseline: Optional operator-configured SaaS integrations
    declarations:
      - { scope: dependency, source: includes/class-payments.php, value: "Stripe Payment Intents, refunds, and signed webhook verification" }
      - { scope: dependency, source: includes/class-eventbrite.php, value: "Eventbrite API event and venue synchronization" }
      - { scope: dependency, source: includes/class-mailchimp.php, value: "Mailchimp audience synchronization" }
      - { scope: dependency, source: includes/class-ml-festival-predictor.php, value: "fixed localhost:8100 ML service health, prediction, optimization, and training API" }
    production_observation: { status: verified, value: "Central host loopback ML /health reports peanut-ml 1.0.0 healthy; Firebase, Stripe, Eventbrite, Mailchimp, and distributed client integrations unverified", observed_at: "2026-08-15T01:34:00-04:00", evidence: "read-only loopback health request; no model training, payment, or third-party integration invoked" }
distribution:
  mode: signed-github-release
  source_of_truth: Canonical Peanut Meta signed publisher plus tagged GitHub Release v1.3.2
  versioned_artifact: "yes"
  signed: "yes"
  canary: unknown
  rollback: unknown
exceptions:
  - id: PAR-205
    concern: JavaScript runtime declarations were below the fleet baseline
    reason: Retired. Frontend package and lock metadata, packageManager, .nvmrc, all four frontend workflow jobs, and the source-owned runtime guard agree on exact Node 22.22.2 and npm 10.9.7.
    risk: Retired; declaration or active CI runtime drift now fails before dependency installation.
    owner: Peanut Graphic
    verification: Require the source-owned declaration contract plus exact active Node/npm verification in every frontend job.
    review_date: "2026-08-31"
    status: retired
  - id: PAR-503
    concern: Required legacy PHP and frontend gates were red on the exact audited base
    reason: Retired. Exact main 5fe0bf2 retains the faithful WordPress mocks and Firebase isolation, compatible Vite 8/plugin-react 6 lock, behavior-based accessibility tests, and correct frontend artifact path. All six current-main workflows pass, including full PHP/frontend suites, accessibility, property matrices, dependency audits, and real WordPress contracts on MySQL and MariaDB.
    risk: Retired; the original harness, dependency, import, and artifact failures are now blocking regressions rather than accepted baseline debt.
    owner: Peanut Graphic
    verification: Require clean install, full PHP and frontend suites, accessibility lint/tests, typecheck, build, property matrices, and real WordPress/MySQL on the exact pull-request and main revisions.
    review_date: "2026-08-31"
    status: retired
  - id: PAR-505
    concern: Frontend dependency security baseline required continuous enforcement
    reason: The repaired lock and current Dependabot feed report zero vulnerabilities. The frontend lint/typecheck job now performs a clean locked install and fails on moderate-or-higher production advisories on pull requests and exact main before downstream tests and build can run.
    risk: Retired; a new moderate production advisory now fails the owning frontend workflow instead of relying on periodic reporting.
    owner: Peanut Graphic
    verification: Keep the blocking moderate production audit and Dependabot feed green; handle any new advisory through an exact, time-bounded ADV exception rather than weakening the fleet floor.
    review_date: "2026-08-22"
    status: retired
  - id: PAR-306
    concern: The declared MySQL 5.7 and MariaDB 10.3 minimums are still not exercised, and client hosts remain unverified
    reason: Real WordPress contracts now run on MySQL 8 and the central installation's MariaDB 10.6 family, covering the many dbDelta tables and the sequential ALTER TABLE migrations this plugin runs during ordinary plugin boot. The plugin still declares support for MySQL 5.7+ and MariaDB 10.3+, so both declared floors sit below every lane that runs, and distributed festival-site versions, collations, SQL modes, and upgrade histories remain unknown.
    risk: DDL, index, collation, migration, or transactional behavior specific to an older declared engine, or to a client-specific collation or SQL mode, can still fail on festival sites without appearing in the required gate.
    owner: Peanut Graphic
    verification: Keep both lanes green; then either add lanes at the declared MySQL 5.7 and MariaDB 10.3 floors or raise the declared minimums to what CI actually proves.
    review_date: "2026-11-14"
    status: accepted
  - id: PAR-310
    concern: Per-install Firebase production evidence remains unverified behind a documented ownership boundary
    reason: docs/FIREBASE-OWNERSHIP.md now defines the optional Realtime Database/Cloud Messaging role, separates it from the shared Peanut Suite backend, assigns repository-versus-installation ownership, and makes plugin and Firebase promotions independent. No repository workflow can yet prove any installation's exact project, rules revision, backup, health, or rollback state.
    risk: An installation can still drift from reviewed rules or lack recovery evidence until its project-specific inventory is completed.
    owner: Peanut Graphic
    verification: For each installation, record the exact project owner, rules digest, credential owner, data retention/export/restore contract, plugin compatibility, health evidence, and rollback action without collecting customer data.
    review_date: "2026-11-14"
    status: accepted
  - id: PAR-401
    concern: Peanut Festival was absent from the canonical signed publisher
    reason: Retired. The vendored canonical release configuration carries peanut-festival, exact tag c550bfb publishes v1.3.2, and the GitHub Release provides the ZIP plus an Ed25519 manifest whose declared SHA-256 matches GitHub's asset digest.
    risk: Retired; current source and the published artifact now share the fleet's authenticated package contract.
    owner: Peanut Graphic
    verification: Keep the curated package/readiness contract and signed ZIP/manifest pair reproducible; canary and rollback evidence remain separately tracked under PAR-405.
    review_date: "2026-08-31"
    status: retired
  - id: PAR-405
    concern: Live update metadata, canary, and rollback evidence remain incomplete
    reason: Exact main uploads the correct non-empty frontend artifact and the signed v1.3.2 ZIP/manifest pair is published. The public update endpoint recognizes Festival and advertises v1.3.2, but its description, installation, changelog, and FAQ still contain Peanut Suite copy, reports can_download=false to an unauthenticated read, and does not prove an installed canary or rollback.
    risk: Operators can receive incorrect product guidance, and source/release evidence alone does not prove that an eligible installed site can download, verify, activate, or roll back the package safely.
    owner: Peanut Graphic
    verification: Keep the exact-head/main frontend artifact guard green; correct Festival-specific public metadata under separate production approval, then prove an eligible read-only canary sees the signed update and document rollback without publishing another release from this unit.
    review_date: "2026-11-14"
    status: accepted
  - id: PAR-407
    concern: Peanut Festival had no updater or package-signature verification gate
    reason: Retired. Version 1.3.2 registers the shared Ed25519 SignedUpdateGate fail closed, pins the Festival public key and allowed hosts, and ships a signed manifest whose package digest matches the GitHub asset. The public update endpoint now recognizes the slug and advertises v1.3.2.
    risk: Retired; current packages have a repository-visible authenticated update path and tampered or incomplete packages are covered by the shared verifier tests.
    owner: Peanut Graphic
    verification: Preserve the source gate, public key, signed publisher contract, and positive/negative verifier tests; live canary/metadata/rollback evidence remains under PAR-405.
    review_date: "2026-08-31"
    status: retired
  - id: PAR-507
    concern: GitHub repository archive conflicted with active maintenance and release-parity scope
    reason: Peanut-Graphic/peanut-festival was archived and read-only while the parity registry marked it maintenance lifecycle, program-scope active, and manifest-required; explicit approval restored archived=false before the manifest workflow.
    risk: The archive had blocked required manifests, fixes, and release onboarding while maintained production-facing code remained active.
    owner: Peanut Graphic
    verification: Explicitly approve and perform repository unarchive before further changes, or formally retire the plugin and document its replacement/data/update boundary.
    review_date: "2026-08-21"
    status: retired
verification:
  status: live-verified
  audited_commit: 5fe0bf22ef48c05342917e1636383187c4a6c5e4
  last_reviewed: "2026-08-31"
  sources:
    - peanut-festival.php
    - composer.json
    - composer.lock
    - frontend/package.json
    - frontend/package-lock.json
    - frontend/eslint.config.js
    - frontend/src/components/common/FormFields.tsx
    - frontend/src/components/common/Modal.tsx
    - frontend/src/components/common/Toast.tsx
    - frontend/src/components/layout/Layout.tsx
    - frontend/src/test/accessibility/components.a11y.test.tsx
    - includes/class-activator.php
    - includes/class-migrations.php
    - includes/class-firebase.php
    - includes/class-realtime-sync.php
    - includes/class-payments.php
    - includes/class-eventbrite.php
    - includes/class-mailchimp.php
    - includes/class-ml-festival-predictor.php
    - docs/DEPLOYMENT.md
    - docs/FIREBASE-OWNERSHIP.md
    - firebase/database.rules.json
    - .github/workflows/ci.yml
    - .github/workflows/tests.yml
    - .github/workflows/accessibility.yml
    - .github/workflows/dependency-audit.yml
    - requirements-dependency-audit.txt
    - requirements-dependency-audit.lock
    - .peanut/platform/requirements.lock
    - .github/workflows/wp-contract.yml
    - scripts/verify-runtime-contract.php
    - scripts/verify-node-runtime-contract.cjs and .nvmrc
    - tests/php/bootstrap.php
    - tests/php/FirebaseTest.php
    - tests/php/NotificationsTest.php
    - Peanut-Graphic/peanut-meta:scripts/publish-plugin.sh
    - .peanut/release/plugin-release-config.sh and verify-release-readiness.sh
    - GitHub Release v1.3.2 ZIP and Ed25519 manifest metadata; exact tag c550bfb338cba52e52e8a062adbe8fffdca75397
    - Peanut License Server /updates/check response for peanut-festival v1.3.1 on 2026-08-31
    - GitHub repository archived-state response
    - Exact-main runs 33309754768, 33309754873, 33309754780, 33309754930, 33309754738, and 33309754760 on 5fe0bf22ef48c05342917e1636383187c4a6c5e4
    - Read-only central first-party PHP, WordPress, active-plugin, WP-Cron, loopback ML health, MariaDB version, collation, and SQL-mode metadata on 2026-08-15
  outstanding:
    - Inventory supported distributed client-host PHP, WordPress, database, scheduler, Firebase, payment, and third-party contracts without collecting customer data.
    - Reconcile why the central minute queue, weekly ML training, daily cleanup, and Eventbrite cleanup hooks are not registered.
    - Keep exact Node 22.22.2/npm 10.9.7 declarations and the source-owned runtime guard green under PAR-205.
    - Keep the blocking moderate frontend dependency audit and current zero-vulnerability baseline green under PAR-508/PAR-505.
    - Keep Composer, the frontend production lock, the hash-locked auditor, and the platform-validator lock blocking-audited under PAR-508; all four surfaces are zero-finding at this review.
    - Cover the declared MySQL 5.7 and MariaDB 10.3 floors, or raise the declared minimums to what CI proves, under PAR-306.
    - Complete the documented project-specific Firebase evidence inventory before any production rules/configuration promotion; keep all Firebase operations separately approval-bound.
    - Correct the public updater's Festival product metadata and prove eligible signed-update canary plus rollback under PAR-405, without changing production from this source-only unit.
