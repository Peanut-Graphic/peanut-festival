schema_version: 1
project:
  id: peanut-festival
  name: Peanut Festival
  classification: distributed-plugin
  repository: https://github.com/Peanut-Graphic/peanut-festival.git
  lifecycle: maintenance
ownership:
  platform: Peanut Graphic
  deployment: Peanut Graphic
  rollback: Peanut Graphic
environments:
  - name: distribution
    kind: production
    provider: GitHub Releases
    url: "https://github.com/Peanut-Graphic/peanut-festival/releases"
  - name: central-first-party-install
    kind: production
    provider: peanutgraphic.com shared WordPress hosting
    url: "https://peanutgraphic.com"
runtimes:
  - name: php
    baseline: WordPress compatibility matrix
    declarations:
      - { scope: dependency, source: peanut-festival.php, value: "Requires PHP 8.0" }
      - { scope: dependency, source: composer.json and composer.lock, value: "runtime require >=8.0; locked development resolver platform 8.1.0 for PHPUnit dependencies" }
      - { scope: ci, source: .github/workflows/ci.yml, value: "required exact PHP 8.0 parser/declarations and exact PHP 8.1 full suite" }
      - { scope: ci, source: .github/workflows/tests.yml and wp-contract.yml, value: "PHP 8.2 and 8.3 property plus PHP 8.3 real WordPress/MySQL" }
    production_observation: { status: verified, value: "PHP 8.5.9 on the central first-party installation; distributed client hosts unverified", observed_at: "2026-08-15T01:09:00-04:00", evidence: "read-only host interpreter and active-plugin inventory" }
  - name: node
    baseline: "22"
    declarations:
      - { scope: dependency, source: frontend/package.json, value: "Vite 8.0.3 with compatible @vitejs/plugin-react 6.0.5; engines and packageManager missing; version 1.3.1" }
      - { scope: ci, source: .github/workflows/ci.yml and accessibility.yml, value: "Node 20" }
    production_observation: { status: not-applicable }
  - name: wordpress
    baseline: WordPress 6.0+
    declarations:
      - { scope: dependency, source: peanut-festival.php, value: "Requires at least 6.0" }
      - { scope: test, source: .github/workflows/wp-contract.yml, value: "WordPress latest" }
    production_observation: { status: verified, value: "WordPress 6.9.7 on the central first-party installation; distributed client hosts unverified", observed_at: "2026-08-15T01:09:00-04:00", evidence: "read-only WP-CLI core-version and active-plugin inventory" }
databases:
  - name: host-database
    role: transactional
    baseline: Host MySQL 5.7+ or MariaDB 10.3+
    declarations:
      - { scope: documentation, source: docs/DEPLOYMENT.md, value: "MySQL 5.7+ or MariaDB 10.3+" }
      - { scope: dependency, source: includes/class-activator.php and includes/class-migrations.php, value: "many dbDelta tables plus sequential versioned ALTER TABLE migrations during normal plugin boot" }
      - { scope: ci, source: .github/workflows/wp-contract.yml, value: "mysql:8 real WordPress REST contract lane" }
    production_equivalent_test: "yes"
    production_observation: { status: verified, value: "MariaDB 10.6.27, latin1_swedish_ci server collation, SQL mode ERROR_FOR_DIVISION_BY_ZERO,NO_AUTO_CREATE_USER,NO_ENGINE_SUBSTITUTION on the central first-party installation; distributed client hosts unverified", observed_at: "2026-08-15T01:09:00-04:00", evidence: "read-only database metadata query; no application rows read" }
  - name: firebase-realtime-database
    role: adjunct
    baseline: Optional per-install Firebase Realtime Database
    declarations:
      - { scope: dependency, source: includes/class-firebase.php, value: "service-account authenticated database and Cloud Messaging calls; writes fail closed without service credentials" }
      - { scope: documentation, source: docs/DEPLOYMENT.md and firebase/database.rules.json, value: "manual project, rules, service-account, and VAPID configuration" }
    production_equivalent_test: unknown
    production_observation: { status: unverified }
services:
  - kind: scheduler
    baseline: WordPress cron on each plugin installation
    declarations:
      - { scope: dependency, source: includes/class-competitions.php, value: "five-minute match deadline checks" }
      - { scope: dependency, source: includes/class-ml-festival-predictor.php, value: "weekly local ML-service training" }
      - { scope: dependency, source: includes/class-deactivator.php, value: "daily cleanup and Eventbrite schedule cleanup hooks" }
    production_observation: { status: verified, value: "Five-minute match-deadline hook registered centrally; minute job queue, weekly ML training, daily cleanup, and Eventbrite cleanup hooks absent", observed_at: "2026-08-15T01:34:00-04:00", evidence: "read-only WP-Cron schedule metadata; no event executed" }
  - kind: realtime
    baseline: Optional Firebase Realtime Database and Cloud Messaging
    declarations:
      - { scope: dependency, source: includes/class-firebase.php and includes/class-realtime-sync.php, value: "OAuth service-account writes, deletes, push notifications, and queued festival state synchronization" }
    production_observation: { status: unverified }
  - kind: other
    baseline: Optional operator-configured SaaS integrations
    declarations:
      - { scope: dependency, source: includes/class-payments.php, value: "Stripe Payment Intents, refunds, and signed webhook verification" }
      - { scope: dependency, source: includes/class-eventbrite.php, value: "Eventbrite API event and venue synchronization" }
      - { scope: dependency, source: includes/class-mailchimp.php, value: "Mailchimp audience synchronization" }
      - { scope: dependency, source: includes/class-ml-festival-predictor.php, value: "fixed localhost:8100 ML service health, prediction, optimization, and training API" }
    production_observation: { status: verified, value: "Central host loopback ML /health reports peanut-ml 1.0.0 healthy; Firebase, Stripe, Eventbrite, Mailchimp, and distributed client integrations unverified", observed_at: "2026-08-15T01:34:00-04:00", evidence: "read-only loopback health request; no model training, payment, or third-party integration invoked" }
distribution:
  mode: manual
  source_of_truth: Historical manually packaged GitHub Release v1.3.1
  versioned_artifact: "yes"
  signed: "no"
  canary: unknown
  rollback: unknown
exceptions:
  - id: PAR-207
    concern: JavaScript runtime declarations remain below the fleet baseline
    reason: PAR-207 reconciles the PHP 8.0 host floor, PHP 8.1 locked development floor, exact-minimum CI, and retained PHP 8.2/8.3/real-WordPress coverage; frontend CI uses Node 20, GitHub actions execute on Node 24, the fleet baseline is Node 22, and frontend/package.json declares neither engines.node nor packageManager.
    risk: Local frontend builds, CI, and release assets can exercise materially different Node/npm versions.
    owner: Peanut Graphic
    verification: Pin fleet Node and npm versions and execute all frontend gates on the declared versions.
    review_date: "2026-11-14"
    status: accepted
  - id: PAR-503
    concern: Required legacy PHP and frontend gates were red on the exact audited base
    reason: The standalone PHP harness lacked current WordPress authentication and integer mocks and leaked Firebase singleton state, while Vite 8 was locked against an incompatible React plugin 4 and accessibility tests imported nonexistent default components; the source repair restores faithful mocks, test isolation, the supported Vite 8/plugin-react 6 pair, and behavior-based tests against the real component APIs.
    risk: Resolved in the candidate source; without the repair, CI fails before meaningful frontend evidence and reports harness and import errors unrelated to installed WordPress behavior.
    owner: Peanut Graphic
    verification: Require clean install, full PHP and frontend suites, accessibility lint/tests, typecheck, build, property matrices, and real WordPress/MySQL on the exact pull-request and main revisions.
    review_date: "2026-08-22"
    status: accepted
  - id: PAR-505
    concern: Frontend dependency audit remains red after the compatibility repair
    reason: A clean install reports 9 production vulnerability paths (4 high and 5 moderate) and 15 total paths (10 high and 5 moderate), including direct axios, DOMPurify, React Router, PostCSS, and Vite findings plus transitives; the Vite/plugin-react repair does not silently broaden into an application-wide dependency migration.
    risk: Known client and build dependency advisories remain until each direct upgrade and transitive graph change is source-audited and regression-tested.
    owner: Peanut Graphic
    verification: Reconcile direct dependency versions in a dedicated repair, run both production-only and full npm audits, and require clean lint, typecheck, unit, accessibility, and build gates on the exact revision.
    review_date: "2026-08-22"
    status: accepted
  - id: PAR-306
    concern: Distributed host databases include MariaDB but required CI exercises only MySQL 8
    reason: The plugin declares MySQL 5.7+ and MariaDB 10.3+, creates many dbDelta tables, and runs sequential ALTER TABLE migrations during ordinary plugin boot. The central first-party installation runs MariaDB 10.6.27 with latin1_swedish_ci and a non-strict SQL mode, while the only real WordPress lane uses mysql:8 and distributed client hosts remain unverified.
    risk: MariaDB- and older-MySQL-specific DDL, index, collation, migration, or transactional behavior can fail on festival sites without appearing in the required gate.
    owner: Peanut Graphic
    verification: Run activation, sequential upgrade, and real-WordPress contracts against every supported MySQL and MariaDB lane.
    review_date: "2026-11-14"
    status: accepted
  - id: PAR-310
    concern: Optional Firebase production ownership and release boundary are install-specific and unverified
    reason: The plugin can write/delete Realtime Database state and send Cloud Messaging notifications using operator-supplied service credentials, while rules deployment and project setup are manual and no repository workflow proves project, revision, backup, health, or rollback state. Central Firebase configuration was deliberately not inspected; only the match-deadline hook is registered, while the minute job queue, weekly ML training, daily cleanup, and Eventbrite cleanup hooks are absent.
    risk: WordPress releases, Firebase rules/configuration, and live realtime data can drift independently without a single auditable owner or rollback contract.
    owner: Peanut Graphic
    verification: Inventory active Firebase projects and rules revisions, document data ownership/backups and fail-closed credentials, and define whether Firebase changes ship with or independently from the plugin.
    review_date: "2026-11-14"
    status: proposed
  - id: PAR-401
    concern: Peanut Festival is absent from the canonical signed publisher
    reason: Peanut Meta publish-plugin.sh has no peanut-festival case, while the latest v1.3.1 release is an unsigned standalone ZIP with no manifest, canary, or rollback evidence and predates substantial main-branch security and CI changes.
    risk: The maintained source cannot produce an authenticated current release through the fleet's authoritative WordPress publishing contract.
    owner: Peanut Graphic
    verification: Add a curated Festival package contract to the central publisher, dry-run it, ship an approved signed release, and prove its active canary and rollback behavior.
    review_date: "2026-11-14"
    status: proposed
  - id: PAR-405
    concern: Frontend CI built tracked assets but uploaded no ephemeral artifact
    reason: Vite writes the production bundle and hidden manifest under assets/dist, while the workflow previously targeted frontend/dist and only emitted a non-blocking no-files warning; the source repair points at the real output, includes the hidden manifest, and fails closed if the directory is absent.
    risk: Resolved in the candidate source; without the repair, green build jobs provide no downloadable artifact and cannot prove the compiled manifest was captured.
    owner: Peanut Graphic
    verification: Require exact-head and exact-main Frontend Build jobs to upload a non-empty frontend-build artifact containing .vite/manifest.json and compiled CSS/JavaScript.
    review_date: "2026-08-22"
    status: accepted
  - id: PAR-407
    concern: Peanut Festival has no updater or package-signature verification gate
    reason: The live license-server API rejects peanut-festival as unknown, source inspection found no updater or upgrader_pre_download gate, and the existing release has no signed manifest.
    risk: Installed Festival copies have no repository-visible authenticated routine update path and cannot reject a tampered or incomplete package.
    owner: Peanut Graphic
    verification: Register the product in the update service and add/test a fail-closed updater that accepts the signed official artifact and rejects invalid signatures and incomplete packages.
    review_date: "2026-11-14"
    status: proposed
  - id: PAR-507
    concern: GitHub repository archive conflicted with active maintenance and release-parity scope
    reason: Peanut-Graphic/peanut-festival was archived and read-only while the parity registry marked it maintenance lifecycle, program-scope active, and manifest-required; explicit approval restored archived=false before the manifest workflow.
    risk: The archive had blocked required manifests, fixes, and release onboarding while maintained production-facing code remained active.
    owner: Peanut Graphic
    verification: Explicitly approve and perform repository unarchive before further changes, or formally retire the plugin and document its replacement/data/update boundary.
    review_date: "2026-08-21"
    status: retired
verification:
  status: live-verified
  audited_commit: 95c9a2623bb0de3b7e41ef1e0072bf0370068323
  last_reviewed: "2026-08-15"
  sources:
    - peanut-festival.php
    - composer.json
    - composer.lock
    - frontend/package.json
    - frontend/package-lock.json
    - frontend/eslint.config.js
    - frontend/src/components/common/FormFields.tsx
    - frontend/src/components/common/Modal.tsx
    - frontend/src/components/common/Toast.tsx
    - frontend/src/components/layout/Layout.tsx
    - frontend/src/test/accessibility/components.a11y.test.tsx
    - includes/class-activator.php
    - includes/class-migrations.php
    - includes/class-firebase.php
    - includes/class-realtime-sync.php
    - includes/class-payments.php
    - includes/class-eventbrite.php
    - includes/class-mailchimp.php
    - includes/class-ml-festival-predictor.php
    - docs/DEPLOYMENT.md
    - firebase/database.rules.json
    - .github/workflows/ci.yml
    - .github/workflows/tests.yml
    - .github/workflows/accessibility.yml
    - .github/workflows/wp-contract.yml
    - scripts/verify-runtime-contract.php
    - tests/php/bootstrap.php
    - tests/php/FirebaseTest.php
    - tests/php/NotificationsTest.php
    - Peanut-Graphic/peanut-meta:scripts/publish-plugin.sh
    - GitHub Release v1.3.1 ZIP metadata and contents
    - Peanut License Server /updates/check response for peanut-festival
    - GitHub repository archived-state response
    - Read-only central first-party PHP, WordPress, active-plugin, WP-Cron, loopback ML health, MariaDB version, collation, and SQL-mode metadata on 2026-08-15
  outstanding:
    - Inventory supported distributed client-host PHP, WordPress, database, scheduler, Firebase, payment, and third-party contracts without collecting customer data.
    - Reconcile why the central minute queue, weekly ML training, daily cleanup, and Eventbrite cleanup hooks are not registered.
    - Align and pin Node and npm declarations under PAR-205.
    - Add supported MariaDB and older-MySQL activation/migration/real-WordPress lanes under PAR-306.
    - Inventory and govern Firebase production state under PAR-310.
    - Add Festival to the signed publisher and authenticated update path under PAR-401 and PAR-407.
